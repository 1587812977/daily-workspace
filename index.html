  /* ---- 0.7 云同步（跨设备）：用 GitHub 私有 Gist 做中转 ----
     安全要点：令牌与同步 ID 存在独立键（wb_sync_token_v1 / wb_sync_gist_v1），
     这两个键不在 SET_KEYS 里，因此既不会被「导出」也不会被「上传」（同步内容只含工作台数据）。 */
  var SYNC_TOKEN_KEY = "wb_sync_token_v1";
  var SYNC_GIST_KEY  = "wb_sync_gist_v1";
  var SYNC_FILE      = "workbench-data.json";
  function syncToken(){ try{ return localStorage.getItem(SYNC_TOKEN_KEY) || ""; }catch(e){ return ""; } }
  function syncGist(){ try{ return localStorage.getItem(SYNC_GIST_KEY) || ""; }catch(e){ return ""; } }
  function syncMsg(text, isErr){
    var el = document.getElementById("syncMsg");
    if(el){ el.textContent = text; el.className = "sync-msg" + (isErr ? " err" : ""); }
    try{ showToast("云同步", 0, text, isErr ? "失败" : "完成"); }catch(e){}
  }
  function syncReadInputs(){
    /* 以输入框为准，兼顾用户刚输入但还没保存的情况 */
    var el = document.getElementById("syncToken"), gi = document.getElementById("syncGist");
    var t = el && el.value ? el.value.trim() : syncToken();
    var g = gi && gi.value ? gi.value.trim() : syncGist();
    return { token:t, gist:g };
  }
  function syncReq(url, token, method, body){
    var opt = { method: method || "GET", headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } };
    if(body){
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt).then(function(r){
      if(!r.ok){
        return r.json().catch(function(){ return {}; }).then(function(e){
          throw new Error((e && e.message) || ("HTTP " + r.status));
        });
      }
      return r.json();
    });
  }
  function syncSaveIds(token, gist){
    try{
      if(token) localStorage.setItem(SYNC_TOKEN_KEY, token);
      if(gist)  localStorage.setItem(SYNC_GIST_KEY, gist);
    }catch(e){}
  }
  function syncUpload(){
    var v = syncReadInputs();
    if(!v.token){ syncMsg("请先填写 GitHub 令牌", true); return; }
    syncSaveIds(v.token, v.gist);
    syncMsg("正在上传…");
    var payload = { description: "个人工作台数据同步", public:false, files:{} };
    payload.files[SYNC_FILE] = { content: JSON.stringify(settingsData(), null, 2) };
    var url = v.gist ? "https://api.github.com/gists/" + v.gist : "https://api.github.com/gists";
    syncReq(url, v.token, v.gist ? "PATCH" : "POST", payload).then(function(j){
      if(j && j.id){
        syncSaveIds(v.token, j.id);
        syncRenderForm();
        syncMsg("上传成功。同步 ID：" + j.id + " —— 另一台设备填同样的令牌 + 这个 ID，点「下载」即可。");
      } else { syncMsg("上传失败：返回数据异常", true); }
    }).catch(function(e){ syncMsg("上传失败：" + (e.message || e), true); });
  }
  function syncDownload(){
    var v = syncReadInputs();
    if(!v.token || !v.gist){ syncMsg("请填写令牌和同步 ID", true); return; }
    syncSaveIds(v.token, v.gist);
    syncMsg("正在下载…");
    syncReq("https://api.github.com/gists/" + v.gist, v.token, "GET").then(function(j){
      var f = j && j.files && j.files[SYNC_FILE];
      if(!f) throw new Error("云端没有找到数据文件");
      var obj = JSON.parse(f.content);
      if(!obj || !obj.data) throw new Error("云端数据格式不正确");
      var keys = Object.keys(obj.data);
      if(!keys.length) throw new Error("云端数据为空");
      var msg = "将用云端 " + keys.length + " 项数据覆盖本机数据，且不可撤销。\n建议先点「导出」备份本机数据。\n确定继续？";
      if(typeof window.confirm === "function" && !window.confirm(msg)){ syncMsg("已取消下载"); return; }
      keys.forEach(function(k){
        try{
          if(obj.data[k] === undefined) localStorage.removeItem(k);
          else localStorage.setItem(k, JSON.stringify(obj.data[k]));
        }catch(e){}
      });
      syncMsg("下载成功，页面即将刷新");
      setTimeout(function(){ if(window.location && window.location.reload) window.location.reload(); }, 900);
    }).catch(function(e){ syncMsg("下载失败：" + (e.message || e), true); });
  }
  function syncClearToken(){
    try{ localStorage.removeItem(SYNC_TOKEN_KEY); localStorage.removeItem(SYNC_GIST_KEY); }catch(e){}
    syncRenderForm();
    syncMsg("已清除本机保存的令牌与同步 ID");
  }
  function syncRenderForm(){
    var el = document.getElementById("syncToken"), gi = document.getElementById("syncGist");

    if(gi) gi.value = syncGist();
  }

     这里做到最接近的一步：点击直达该游戏的获取流程页（?action=purchase），
     并提供「复制链接」和「已领取」标记，避免漏领或重复领。 */
  var EPIC_KEY = "wb_epic_claimed_v1";
  function loadEpicClaimed(){
    try{ var a = JSON.parse(localStorage.getItem(EPIC_KEY)); return Array.isArray(a) ? a : []; }
    catch(e){ return []; }
  }
  function saveEpicClaimed(a){ try{ localStorage.setItem(EPIC_KEY, JSON.stringify(a)); }catch(e){} }
  function epicId(g){ return (g.title||"") + "|" + (g.free_end||""); }
  function epicClaimed(id){ return loadEpicClaimed().indexOf(id) >= 0; }
  function epicToggleClaim(id){

  function epicClaimUrl(g){

  function epicLeft(end){
    if(!end) return "";
    try{

      if(_f) _f.classList.add("open");
    }else if(typeof applyFold === "function"){ applyFold(); }
    /* 本地板块（打卡 / 代办 / 收藏）不依赖云端资讯，无数据也照常渲染 */
    var isLocal = (curSec === "checkin" || curSec === "fav" || curSec === "todo" || curSec === "book" || curSec === "settings" || loadAddedMods().indexOf(curSec) >= 0);
    if(!has && !isLocal){
      /* 无资讯数据时：本地板块照常，其余给引导 */
      grid.className = "grid";
      grid.innerHTML = (curSec === "all" || curSec === "checkin" ? pCheckin() : "")
        + (curSec === "checkin" ? "" :
           '<section class="card card-acc-cyan"><div class="card-body"><div class="empty">'
           + '资讯数据尚未生成。<br>请等待 GitHub Actions 完成首次刷新，或手动触发仓库的 refresh-data 工作流。</div></div></section>');
    }else{
      grid.innerHTML = s.fn();
    }
    ciBind();
    bindTodo();
    bindBook();
    bindSettings();
    bindHotTabs();
    /* 已添加的可选模块：总览页逐个绑定，单模块页按需绑定 */
    if(curSec === "all"){ loadAddedMods().forEach(function(k){ if(MOD_BIND[k]) MOD_BIND[k](); }); }
    else if(MOD_BIND[curSec]){ MOD_BIND[curSec](); }
    updateSideCheckin();
    var navs = document.querySelectorAll("[data-sec]");
    for(var i=0;i<navs.length;i++){
      if(navs[i].getAttribute("data-sec") === curSec) navs[i].classList.add("on");
      else navs[i].classList.remove("on");
    }
    if(window.scrollY > 120) window.scrollTo(0, 0);
  }

  document.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("[data-sec]") : null;
    if(!b) return;
    var s = b.getAttribute("data-sec");
    if(!SEC[s] || s === curSec) return;
    curSec = s;
    renderSec();
  });

  function bindSidebarCheckin(){
    var sideSign = document.getElementById("sideSignBtn");
    if(sideSign && !sideSign.__wbBound){
      sideSign.__wbBound = true;
      sideSign.addEventListener("click", function(){ signToggle(); });
    }
    updateSideCheckin();
  }

  /* ---- 移动端抽屉菜单 ---- */
  function closeDrawer(){
    if(document.body && document.body.classList) document.body.classList.remove("drawer-open");
  }
  var menuBtn = document.getElementById("menuBtn");
  if(menuBtn){
    menuBtn.addEventListener("click", function(){
      if(document.body && document.body.classList) document.body.classList.toggle("drawer-open");
    });
  }
  var drawerMask = document.getElementById("drawerMask");
  if(drawerMask) drawerMask.addEventListener("click", closeDrawer);
  /* 选中板块后自动收起抽屉 */
  document.addEventListener("click", function(ev){
    var nav = ev.target.closest ? ev.target.closest("[data-sec]") : null;
    if(nav) closeDrawer();
  });
  /* 窗口放大回电脑宽度时，关掉抽屉避免残留遮罩 */
  if(window.addEventListener){
    window.addEventListener("resize", function(){
      if(window.innerWidth > 900) closeDrawer();
    });
  }

  /* ---- 导航分组折叠 ---- */
  var FOLD_KEY = "wb_nav_fold_v1";
  function loadFold(){
    try{ return localStorage.getItem(FOLD_KEY) === "1"; }catch(e){ return false; }
  }
  function saveFold(v){ try{ localStorage.setItem(FOLD_KEY, v ? "1" : "0"); }catch(e){} }
  function applyFold(){
    var folded = loadFold();
    if(document.body && document.body.classList) document.body.classList.toggle("nav-fold-news", folded);
    var f = document.querySelector ? document.querySelector("[data-fold]") : null;
    if(f) f.classList.toggle("open", !folded);
  }
  applyFold();
  var foldBtn = document.querySelector ? document.querySelector("[data-fold]") : null;
  if(foldBtn){
    foldBtn.addEventListener("click", function(ev){
      if(ev.stopPropagation) ev.stopPropagation();
      if(ev.preventDefault) ev.preventDefault();
      var folded = !loadFold();
      saveFold(folded);
      applyFold();
    });
  }

  /* Epic「标记已领」+ 收藏夹操作：事件委托在 grid 上，innerHTML 重建后依然有效 */
  grid.addEventListener("click", function(ev){
    var t = ev.target;
    var pick = function(sel){ return t.closest ? t.closest(sel) : null; };

    /* Epic 已领标记 */
    var got = pick("[data-got]");
    if(got){
      ev.preventDefault();
      epicToggleClaim(got.getAttribute("data-got"));
      renderSec();
      return;
    }
    /* 收藏夹：删除 */
    var del = pick("[data-fdel]");
    if(del){
      favRemove(del.getAttribute("data-fdel"));
      renderSec();
      return;
    }
    /* 收藏夹：类型筛选 */
    var chip = pick("[data-ftype]");
    if(chip){
      favFilter = chip.getAttribute("data-ftype") || "";
      renderSec();
      return;
    }
    /* 收藏夹：添加 */
    if(t.id === "favAddBtn" || pick("#favAddBtn")){
      favAddFromForm();
      return;
    }
    /* 收藏夹：导出 / 导入 */
    if(pick("[data-fexp]")){ favExport(); return; }
    if(pick("[data-fimp]")){ favImport(); return; }
  });
  /* 搜索框：input 事件（防抖 200ms 后重渲染） */
  var favQT = null;
  grid.addEventListener("input", function(ev){
    if(!ev.target || ev.target.id !== "favQ") return;
    favQ = ev.target.value || "";
    clearTimeout(favQT);
    favQT = setTimeout(function(){
      renderSec();
      var q = document.getElementById("favQ");
      if(q){ if(q.focus) q.focus(); q.value = favQ; }
    }, 260);
  });

  function favVal(id){
    var e = document.getElementById(id);
    return e ? (e.value || "").trim() : "";
  }
  function favAddFromForm(){
    var url = favVal("favUrl"), title = favVal("favTitle"), note = favVal("favNote");
    if(!url && !title && !note) return;
    favAdd({
      id: "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      url: url, title: title, note: note,
      type: favTypeOf(url), at: favTime()
    });
    renderSec();
    var u = document.getElementById("favUrl");
    if(u && u.focus) u.focus();
  }
  function favExport(){
    try{
      var blob = new Blob([JSON.stringify(loadFav(), null, 2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "我的收藏夹-" + ciKey() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }catch(e){}
  }
  function favImport(){
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/json,.json";
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0];
      if(!f) return;
      var r = new FileReader();
      r.onload = function(ev){
        try{
          var arr = JSON.parse(ev.target.result);
          if(!Array.isArray(arr)) return;
          var cur = loadFav();
          var has = {};
          cur.forEach(function(x){ has[x.id] = 1; });
          arr.forEach(function(x){
            if(!x || has[x.id]) return;
            cur.push({id:x.id||("i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
              url:x.url||"", title:x.title||"", note:x.note||"",
              type:favTypeOf(x.url, x.type), at:x.at||favTime()});
          });
          saveFav(cur);
          renderSec();
        }catch(e){}
      };
      r.readAsText(f);
    });
    inp.click();
  }

  /* ---- 左侧栏导航拖拽排序 ---- */
  var NAV_ORDER_KEY = "wb_nav_order_v1";
  function loadNavOrder(){
    try{ var a = JSON.parse(localStorage.getItem(NAV_ORDER_KEY)); return Array.isArray(a) ? a : null; }
    catch(e){ return null; }
  }
  function saveNavOrder(){
    var order = [];
    document.querySelectorAll("#nav .nav-item").forEach(function(el){
      order.push(el.getAttribute("data-sec"));
    });
    try{ localStorage.setItem(NAV_ORDER_KEY, JSON.stringify(order)); }catch(e){}
  }
  function pinAllFirst(nav){
    if(!nav || !nav.querySelectorAll) return;
    var items = [];
    nav.querySelectorAll(".nav-item").forEach(function(el){ items.push(el); });
    var all = null;
    items.forEach(function(el){ if(el.getAttribute("data-sec") === "all") all = el; });
    if(all && items.length && items[0] !== all) nav.insertBefore(all, items[0]);
  }
  function applyNavOrder(){
    var order = loadNavOrder();
    var nav = document.getElementById("nav");
    if(!order || !nav || !nav.querySelectorAll) return;
    var items = {};
    nav.querySelectorAll(".nav-item").forEach(function(el){
      items[el.getAttribute("data-sec")] = el;
    });
    order.forEach(function(sec){
      if(items[sec]) nav.appendChild(items[sec]);
    });
    pinAllFirst(nav);                 /* 全部总览固定在第一排 */
  }
function isTouchDevice(){
  try{
    if(window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return true;
    if('ontouchstart' in window || (navigator && navigator.maxTouchPoints > 0)) return true;
  }catch(e){}
  return false;
}
function bindNavDrag(){
  var nav = document.getElementById("nav");
  if(!nav || !nav.querySelectorAll) return;
  var touch = isTouchDevice();
  var dragEl = null;
    function isAll(x){ return x && x.getAttribute("data-sec") === "all"; }
    function isSub(x){ return x && x.getAttribute("data-parent") === "news"; }
    /* 子项只能在子项之间移动，普通项只能在普通项之间移动，
       避免把「今日热点资讯」的 4 个子项拖散到其他位置 */
    function canDrop(from, to){
      if(!from || !to) return false;
      if(isSub(from) !== isSub(to)) return false;
      return true;
    }
  nav.querySelectorAll(".nav-item").forEach(function(el){
    if(el.__dragBound) return;          /* 添加模块后重绑时不重复挂监听 */
    el.__dragBound = true;
    if(touch){
      el.draggable = false;
      el.removeAttribute("draggable");
      return;
    }
    el.draggable = true;
    el.addEventListener("dragstart", function(e){
        if(isAll(el)){ e.preventDefault(); return; }   /* 全部总览不可拖 */
        dragEl = el;
        el.classList.add("dragging");
        if(e.dataTransfer) e.dataTransfer.effectAllowed = "move";
      });
      el.addEventListener("dragend", function(){
        el.classList.remove("dragging");
        nav.querySelectorAll(".nav-item").forEach(function(x){ x.classList.remove("drag-over"); });
        dragEl = null;
      });
      el.addEventListener("dragover", function(e){
        if(isAll(el)) return;                          /* 不能插到全部总览前面 */
        if(dragEl && !canDrop(dragEl, el)) return;     /* 分组内外不互串 */
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
        if(el !== dragEl) el.classList.add("drag-over");
      });
      el.addEventListener("dragleave", function(){
        el.classList.remove("drag-over");
      });
      el.addEventListener("drop", function(e){
        el.classList.remove("drag-over");
        if(!dragEl || el === dragEl || isAll(el)) return;
        if(!canDrop(dragEl, el)) return;               /* 分组内外不互串 */
        e.preventDefault();
        var items = Array.from(nav.querySelectorAll(".nav-item"));
        var from = items.indexOf(dragEl);
        var to = items.indexOf(el);
        if(from < 0 || to < 0) return;
        if(from < to) nav.insertBefore(dragEl, el.nextSibling);
        else nav.insertBefore(dragEl, el);
        pinAllFirst(nav);                              /* 始终固定第一位 */
        saveNavOrder();
        dragEl = null;
      });
    });
  }

  try{
    mountAddedMods();          /* 恢复已添加的可选模块（SEC + 侧栏） */
    applyNavOrder();
    bindNavDrag();
    bindAddFeat();
    renderSec();
    startTodoTimer();
    todoUpdateBadge();
    bindBook();
    bindSettings();
  }catch(e){
    if(window.console) console.error("工作台初始化异常（不影响左侧栏打卡）：", e);
  }
})();
</script>
