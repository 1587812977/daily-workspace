<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人工作台 · 每日信息中枢</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#0ea5e9">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f4f6f8;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#f8f9fb;
  --line:rgba(0,0,0,.08);
  --line2:rgba(0,0,0,.05);
  --txt:#1f2937;
  --txt2:#6b7280;
  --txt3:#9ca3af;
  --cyan:#0ea5e9;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --orange:#f97316;
  --blue:#3b82f6;
  --green:#10b981;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
body.dark{
  --bg:#070b16;
  --bg2:#0b1120;
  --card:#0e1626;
  --card2:#121c30;
  --line:rgba(148,163,184,.14);
  --line2:rgba(148,163,184,.10);
  --txt:#e2e8f0;
  --txt2:#8fa0b8;
  --txt3:#5b6b82;
  --cyan:#22d3ee;
  --purple:#a78bfa;
  --pink:#f472b6;
  --orange:#fb923c;
  --blue:#60a5fa;
  --green:#34d399;
}
/* 黑白极简风：灰阶变量覆盖（基于浅色，无彩色） */
body.theme-mono{
  --bg:#f3f3f3;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#ededed;
  --line:rgba(0,0,0,.12);
  --line2:rgba(0,0,0,.07);
  --txt:#141414;
  --txt2:#4d4d4d;
  --txt3:#8a8a8a;
  --cyan:#2f2f2f;
  --purple:#555555;
  --pink:#666666;
  --orange:#666666;
  --blue:#444444;
  --green:#2f2f2f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.75;
  min-height:100vh;
}
body.dark{
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(34,211,238,.09), transparent 60%),
    radial-gradient(900px 480px at 0% 110%, rgba(167,139,250,.08), transparent 60%),
    var(--bg);
}
body.dark::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(148,163,184,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.045) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
}
a{color:inherit;text-decoration:none}
/* ===== 布局骨架：左侧栏 + 主区 ===== */
.app{position:relative;display:flex;align-items:flex-start;min-height:100vh}
.side{
  width:216px;flex:none;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(14,22,38,.96),rgba(9,14,26,.96));
  border-right:1px solid var(--line);
}
.brand{padding:22px 18px 16px;border-bottom:1px solid var(--line)}
.brand .lg{display:flex;align-items:center;gap:10px}
.brand .mk{
  width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#04121a;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  box-shadow:0 0 14px rgba(34,211,238,.32);
}
.brand h1{font-size:15.5px;font-weight:680;letter-spacing:.5px}
.brand .sub{font-size:10px;color:var(--txt3);font-family:var(--mono);margin-top:5px;letter-spacing:.6px}
.nav{padding:12px 10px;flex:1;overflow-y:auto;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:#22314b;border-radius:3px}
.nav .cap{font-size:10px;color:var(--txt3);font-family:var(--mono);letter-spacing:1.4px;padding:6px 10px 8px}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:9px 11px;margin-bottom:3px;border:0;border-radius:10px;
  background:transparent;color:var(--txt2);cursor:pointer;text-align:left;
  font-size:14px;transition:background .16s,color .16s;position:relative;font-family:inherit;
}
.nav-item:hover{background:rgba(148,163,184,.08);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(34,211,238,.03));color:#eafcff}
.nav-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
.nav-item .ic{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-item .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item.on .ic{color:var(--cyan)}
.nav-item .bd{flex:1;min-width:0}
.nav-item .lb{font-weight:560;letter-spacing:.3px;display:block}
.nav-item .ds{font-size:10.5px;color:var(--txt3);font-family:var(--mono);display:block;margin-top:1px}
/* 触控设备上禁用导航项拖拽，避免抽屉里的按钮点不动 */
@media (pointer: coarse){ .nav-item{ -webkit-user-drag:none; user-select:none; -webkit-user-select:none; touch-action:manipulation; } }
.side-foot{padding:12px 16px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--txt3);font-family:var(--mono);line-height:1.95}
.side-foot b{color:var(--cyan);font-weight:500}
.side-foot .dotr{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);margin-right:5px;animation:pulse 2s infinite}
.main{flex:1;min-width:0;padding:26px 30px 50px}

/* ===== 顶部 ===== */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 18px;margin-bottom:30px}
h1{
  font-size:26px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(92deg,#e2e8f0 20%,var(--cyan) 60%,var(--purple) 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
h1 .dot{color:var(--cyan);-webkit-text-fill-color:var(--cyan)}
.live{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:12px;color:var(--cyan);
  border:1px solid rgba(34,211,238,.35);border-radius:999px;
  padding:3px 12px;background:rgba(34,211,238,.07);
}
.live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.updated{font-size:13px;color:var(--txt3);font-family:var(--mono)}

/* ===== 网格 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:22px}
/* 单板块聚焦时，卡片拉满宽度 */
.grid.solo{grid-template-columns:minmax(0,1fr)}
.grid.solo .card{box-shadow:0 10px 34px rgba(2,6,18,.55)}
@media (max-width:900px){
  .app{display:block}
  .side{
    width:auto;height:auto;position:sticky;top:0;z-index:30;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .brand{padding:12px 14px 10px}
  .brand .sub{display:none}
  .nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .cap{display:none}
  .nav-item{width:auto;flex:none;margin-bottom:0;padding:7px 13px;border-radius:999px;border:1px solid var(--line)}
  .nav-item.on{border-color:rgba(34,211,238,.4)}
  .nav-item.on::before{display:none}
  .nav-item .ds{display:none}
  .side-foot{display:none}
  .main{padding:18px 15px 40px}
  .grid{grid-template-columns:1fr;gap:16px}
}
@media (max-width:520px){.main{padding:15px 12px 36px}}

/* ===== 卡片 ===== */
.card{
  background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);
  border:1px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 30px rgba(2,6,18,.5);
}
.card-head{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px 14px;border-bottom:1px solid var(--line);
  position:relative;
}
.card-head::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:var(--accent,var(--cyan));box-shadow:0 0 12px var(--accent,var(--cyan));
}
.card-head .ico{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  background:color-mix(in srgb, var(--accent,var(--cyan)) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--accent,var(--cyan)) 35%, transparent);
}
.card-head .ttl{font-size:16.5px;font-weight:650;letter-spacing:.5px}
.card-head .sub{font-size:12px;color:var(--txt3);font-family:var(--mono);margin-left:auto;white-space:nowrap}
.card-body{padding:16px 20px 20px;overflow-y:auto;max-height:74vh;scrollbar-width:thin;scrollbar-color:#2a3a55 transparent}
.card-body::-webkit-scrollbar{width:6px}
.card-body::-webkit-scrollbar-thumb{background:#2a3a55;border-radius:3px}
.card-acc-cyan{--accent:var(--cyan)}
.card-acc-purple{--accent:var(--purple)}
.card-acc-blue{--accent:var(--blue)}
.card-acc-orange{--accent:var(--orange)}
.card-acc-pink{--accent:var(--pink)}
.card-acc-green{--accent:var(--green)}

/* ===== 今日代办 ===== */
.todo-bar{display:flex;gap:8px;margin-bottom:12px}
.todo-input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(148,163,184,.06);color:var(--txt);font-size:14px;font-family:inherit;outline:none}
.todo-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.todo-add{padding:0 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s}
.todo-add:hover{filter:brightness(1.08)}
.todo-prog{font-size:12.5px;color:var(--txt2);font-family:var(--mono);margin-bottom:10px}
.todo-prog b{color:var(--blue)}
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.todo-item{display:flex;align-items:flex-start;gap:11px;padding:10px 11px;border-radius:11px;
  background:rgba(148,163,184,.05);border:1px solid transparent;transition:background .15s}
.todo-item:hover{background:rgba(148,163,184,.09)}
.todo-item.done{opacity:.6}
.todo-check{width:22px;height:22px;flex:none;margin-top:1px;border-radius:7px;cursor:pointer;
  border:1.6px solid var(--txt3);color:transparent;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent}
.todo-item.done .todo-check{background:var(--blue);border-color:var(--blue);color:#fff}
.todo-main{flex:1;min-width:0}
.todo-text{color:var(--txt);font-size:14.5px;line-height:1.45;word-break:break-word}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--txt3)}
.todo-tag{display:inline-block;margin-left:6px;font-size:10.5px;color:var(--txt3);
  border:1px solid var(--line);border-radius:5px;padding:0 6px;font-family:var(--mono);letter-spacing:.5px}
.todo-time{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.todo-time label{font-size:12px;color:var(--txt2);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.todo-time-in{border:1px solid var(--line);border-radius:7px;background:rgba(148,163,184,.08);
  color:var(--txt);font-size:12.5px;font-family:var(--mono);padding:3px 6px;outline:none}
.todo-time-in:focus{border-color:var(--blue)}
.todo-clock{font-size:12px;color:var(--blue);font-family:var(--mono)}
.todo-clock.ok{color:var(--txt3)}
.todo-del{flex:none;width:24px;height:24px;border-radius:7px;border:0;cursor:pointer;
  background:transparent;color:var(--txt3);font-size:14px;transition:all .15s}
.todo-del:hover{background:rgba(239,68,68,.14);color:#ef4444}
.todo-foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.todo-clear{padding:6px 14px;border:1px solid var(--line);border-radius:9px;background:transparent;
  color:var(--txt2);font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s}
.todo-clear:hover{color:#ef4444;border-color:rgba(239,68,68,.4)}
.todo-hint{font-size:11.5px;color:var(--txt3);line-height:1.5}
.nav-badge{position:absolute;top:4px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;font-family:var(--mono);
  display:none;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(251,146,60,.5);pointer-events:none}
.nav-badge.show{display:flex}

.empty{color:var(--txt3);font-size:14px;padding:30px 0;text-align:center}

/* ===== 通用条目 ===== */
.row{display:flex;gap:12px;padding:11px 10px;border-radius:10px;transition:background .15s}
.row:hover{background:rgba(148,163,184,.07)}
.row:active{background:rgba(148,163,184,.12)}
.row .t{flex:1;min-width:0}
.row .t .title{color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.row:hover .t .title{color:var(--accent,var(--cyan))}
.meta{font-size:12.5px;color:var(--txt3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono)}
.meta .src{color:var(--txt2)}
.sum{font-size:13.5px;color:var(--txt2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}

.rank{
  flex:none;width:26px;height:26px;margin-top:2px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12.5px;font-weight:700;
  color:var(--txt3);background:rgba(148,163,184,.09);
}
.rank.top{color:#06121f;background:var(--accent,var(--cyan));box-shadow:0 0 10px color-mix(in srgb, var(--accent,var(--cyan)) 60%, transparent)}

.hotv{font-size:12px;color:var(--orange);font-family:var(--mono);flex:none;margin-top:4px}

/* ===== 分区标题 ===== */
.sec-title{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--txt2);font-weight:600;letter-spacing:1.5px;
  margin:20px 0 6px;
}
.sec-title:first-child{margin-top:2px}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-title .b{color:var(--accent,var(--cyan))}

/* ===== 平台 Tab ===== */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{
  padding:5px 14px;border-radius:999px;font-size:13.5px;color:var(--txt2);
  border:1px solid var(--line);cursor:pointer;user-select:none;transition:all .15s;
  background:transparent;font-family:inherit;
}
.tab:hover{color:var(--txt);border-color:rgba(148,163,184,.35)}
.tab.on{
  color:#06121f;background:var(--orange);border-color:var(--orange);
  font-weight:650;box-shadow:0 0 14px rgba(251,146,60,.45);
}

/* ===== Epic ===== */
.epic{
  border:1px solid rgba(52,211,153,.3);border-radius:12px;
  background:linear-gradient(135deg,rgba(52,211,153,.08),rgba(34,211,238,.05));
  padding:14px 16px;margin-bottom:14px;
}
.epic .g{padding:8px 0}
.epic .g .title{color:var(--txt);font-weight:600;font-size:14.5px}
.epic .g:hover .title{color:var(--green)}
.epic .gm{font-size:12.5px;color:var(--txt2);font-family:var(--mono);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.epic .free{color:var(--green);font-weight:700}
.epic .cut{color:var(--green)}
.tag-epic{display:inline-block;font-size:11px;font-family:var(--mono);color:var(--green);
  border:1px solid rgba(52,211,153,.4);border-radius:5px;padding:1px 7px;margin-bottom:6px;letter-spacing:1px}

/* ===== 日报板块 ===== */
.daily-date{font-family:var(--mono);font-size:12.5px;color:var(--purple);letter-spacing:1px}

/* ===== 每日打卡 ===== */
.ci-prog{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.ci-count{font-family:var(--mono);font-size:13px;color:var(--txt2)}
.ci-count b{color:var(--green);font-size:16px}
.ci-bar{height:8px;border-radius:99px;background:rgba(148,163,184,.12);margin-top:8px;overflow:hidden}
.ci-bar i{display:block;height:100%;border-radius:inherit;width:0;
  background:linear-gradient(90deg,var(--green),var(--cyan));
  box-shadow:0 0 12px rgba(52,211,153,.45);transition:width .4s ease}
.ci-item{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;transition:background .15s}
.ci-item:hover{background:rgba(148,163,184,.07)}
.ci-check{
  width:24px;height:24px;border-radius:8px;flex:none;cursor:pointer;
  border:1.5px solid var(--txt3);color:transparent;font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.ci-item.done .ci-check{
  background:var(--green);border-color:var(--green);color:#06121f;
  box-shadow:0 0 10px rgba(52,211,153,.55);
}
.ci-name{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-item.done .ci-name{color:var(--txt2)}
.ci-streak{font-size:12px;color:var(--orange);font-family:var(--mono);flex:none}
.ci-src{font-size:10px;margin-left:6px;opacity:.55;vertical-align:middle}
/* 月历 */
.ci-cal{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;background:rgba(8,13,24,.35)}
.ci-cal-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ci-cal-nav{
  width:26px;height:26px;flex:none;border-radius:8px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(148,163,184,.06);color:var(--txt2);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:.15s;font-family:inherit;
}
.ci-cal-nav:hover{background:rgba(52,211,153,.16);color:var(--green);border-color:rgba(52,211,153,.4)}
.ci-cal-tt{flex:1;text-align:center;font-size:14px;font-weight:600;letter-spacing:.5px;font-family:var(--mono)}
.ci-cal-today{
  flex:none;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:var(--green);
  border-radius:8px;padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.15s;
}
.ci-cal-today:hover{background:rgba(52,211,153,.22)}
.ci-cal-cnt{flex:none;font-size:11.5px;color:var(--txt3);font-family:var(--mono)}
.ci-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ci-cal-dow{text-align:center;font-size:11px;color:var(--txt3);font-family:var(--mono);padding-bottom:4px}
.ci-cal-cell{
  position:relative;aspect-ratio:1;border-radius:7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(148,163,184,.07);border:1px solid transparent;transition:.15s;
}
.ci-cal-cell span{font-size:12px;font-family:var(--mono);color:var(--txt2);line-height:1}
.ci-cal-cell i{
  position:absolute;bottom:3px;right:4px;font-size:8.5px;font-style:normal;
  color:var(--green);font-family:var(--mono);opacity:.9;
}
.ci-cal-cell:hover{border-color:rgba(52,211,153,.5)}
.ci-cal-cell.out{opacity:.25;cursor:default}
.ci-cal-cell.out:hover{border-color:transparent}

.ci-cal-cell.today span{color:var(--cyan);font-weight:700}
.ci-cal-cell.sel{outline:2px solid var(--orange);outline-offset:-2px}
.ci-cal-cell.l1{background:rgba(52,211,153,.22)}
.ci-cal-cell.l2{background:rgba(52,211,153,.4)}
.ci-cal-cell.l3{background:rgba(52,211,153,.62)}
.ci-cal-cell.l4{background:rgba(52,211,153,.85)}

.ci-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--txt3);font-family:var(--mono)}
.ci-legend em{width:11px;height:11px;border-radius:3px;display:inline-block;margin:0 1px}
.ci-legend em.l0{background:rgba(148,163,184,.07)}
.ci-legend em.l1{background:rgba(52,211,153,.22)}
.ci-legend em.l2{background:rgba(52,211,153,.4)}
.ci-legend em.l3{background:rgba(52,211,153,.62)}
.ci-legend em.l4{background:rgba(52,211,153,.85)}
.ci-legend b{margin-left:auto;font-weight:400;opacity:.75}

/* 选中日明细 */
.ci-day{margin-top:14px}
.ci-day-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;padding:0 2px}
.ci-day-hd span:first-child{font-weight:600;color:var(--txt);font-size:14px}
.ci-day-dt{font-family:var(--mono);font-size:11.5px;color:var(--txt3)}
.ci-day-fut{padding:16px 0;text-align:center;font-size:13px;color:var(--txt3)}
.ci-item.pin{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.2)}
.ci-item.pin .ci-name{font-weight:600}

/* 删除二次确认（内联，不用弹窗） */

.ci-item.cf:hover{background:rgba(248,113,113,.12)}
.ci-item.cf .ci-name{color:#fca5a5;font-size:13.5px}
.ci-cf-ok,.ci-cf-no{
  flex:none;border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.ci-cf-ok{background:rgba(248,113,113,.2);border:1px solid rgba(248,113,113,.45);color:#fca5a5}
.ci-cf-ok:hover{background:rgba(248,113,113,.32);color:#fff}
.ci-cf-no{background:transparent;border:1px solid var(--line2);color:var(--txt3)}
.ci-cf-no:hover{color:var(--txt);border-color:var(--txt3)}

/* 已删除项（可恢复） */
.ci-bin{margin-top:12px;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px;background:rgba(148,163,184,.03)}
.ci-bin-hd{font-size:11.5px;color:var(--txt3);font-family:var(--mono);margin-bottom:7px}
.ci-bin-list{display:flex;flex-wrap:wrap;gap:6px}
.ci-bin-item{
  border:1px solid var(--line2);background:rgba(148,163,184,.07);color:var(--txt2);
  border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;
}
.ci-bin-item:hover{background:rgba(52,211,153,.14);color:var(--green);border-color:rgba(52,211,153,.35)}
.ci-sync{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--txt3);font-family:var(--mono);line-height:1.7}
.ci-del{
  flex:none;width:22px;height:22px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--txt3);font-size:15px;line-height:1;transition:all .15s;
}
.ci-del:hover{color:#f87171;background:rgba(248,113,113,.12)}
.ci-add{display:flex;gap:8px;margin-top:12px}
.ci-add input{
  flex:1;min-width:0;background:rgba(148,163,184,.07);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);padding:8px 12px;font:inherit;font-size:14px;outline:none;
}
.ci-add input:focus{border-color:rgba(52,211,153,.5)}
.ci-add input::placeholder{color:var(--txt3)}
.ci-add button{
  flex:none;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.4);
  color:var(--green);border-radius:9px;width:42px;cursor:pointer;
  font-size:17px;font-weight:700;transition:all .15s;font-family:inherit;
}
.ci-add button:hover{background:rgba(52,211,153,.25);box-shadow:0 0 10px rgba(52,211,153,.35)}
/* 打卡成功弹出提示 */
#ciToast{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .25s;
}
#ciToast[hidden]{display:none}          /* 必须显式声明，否则 display:flex 会压过 hidden */
#ciToast.on{opacity:1}
.ts-card{
  background:linear-gradient(160deg,rgba(16,25,42,.98),rgba(9,14,26,.98));
  border:1px solid rgba(52,211,153,.42);border-radius:18px;
  padding:26px 34px 24px;text-align:center;min-width:236px;max-width:86vw;
  box-shadow:0 22px 60px rgba(2,6,18,.72), 0 0 42px rgba(52,211,153,.16);
  transform:scale(.8) translateY(12px);opacity:0;
  transition:transform .36s cubic-bezier(.2,1.5,.4,1), opacity .26s;
}
#ciToast.on .ts-card{transform:scale(1) translateY(0);opacity:1}
.ts-ring{
  position:relative;width:68px;height:68px;margin:0 auto 15px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 28px rgba(52,211,153,.5);
  animation:tsPop .52s cubic-bezier(.2,1.6,.4,1);
}
.ts-ring::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(52,211,153,.55);animation:tsRipple .9s ease-out .12s both;
}
@keyframes tsPop{0%{transform:scale(0) rotate(-28deg)}62%{transform:scale(1.16) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes tsRipple{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.ts-ic{font-size:34px;color:#04121a;font-weight:800;line-height:1}
.ts-tt{font-size:19px;font-weight:700;letter-spacing:1.2px}
.ts-sb{font-size:12.5px;color:var(--txt2);margin-top:5px;font-family:var(--mono)}
.ts-ms{
  margin-top:12px;padding-top:11px;border-top:1px dashed rgba(52,211,153,.3);
  font-size:13.5px;color:var(--green);line-height:1.6;
}

/* 音效开关 */
.ci-mute{
  flex:none;width:26px;height:26px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(148,163,184,.06);
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:.15s;font-family:inherit;
}
.ci-mute:hover{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.12)}
.ci-mute.off{opacity:.5}

@media (prefers-reduced-motion:reduce){
  .ts-card,.ts-ring,.ts-ring::after{animation:none;transition:opacity .2s}
}

.ci-streak-line{margin-top:14px;font-size:13px;color:var(--txt2)}
.ci-streak-line b{color:var(--green);font-size:15px}
.ci-right{flex:1;min-width:0}

/* 月历头部新样式 */
.ci-cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.ci-cal-tt{font-size:22px;font-weight:700;color:var(--txt);display:flex;align-items:baseline;gap:10px}
.ci-cal-tt span{font-size:15px;color:var(--txt3);font-weight:500;font-family:var(--mono)}
.ci-cal-tools{display:flex;align-items:center;gap:8px}
.ci-cal-today{flex:none;border:1px solid var(--line);background:transparent;color:var(--txt2);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.ci-cal-today:hover{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.06)}

/* SELECTED DAY 区域 */
.ci-day-section{
  border:1px solid var(--line);border-radius:18px;padding:22px 24px 18px;
  background:var(--card);margin-bottom:16px;
}
.ci-day-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.ci-day-tag{font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:1.5px;margin-bottom:4px}
.ci-day-date{font-size:26px;font-weight:700;color:var(--txt);letter-spacing:-.5px}
.ci-day-actions{display:flex;gap:8px}
.ci-act-btn{
  border:1px solid var(--line);background:transparent;color:var(--txt2);
  border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.ci-act-btn:hover{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.06)}

/* 事项列表：单选圆圈 */
.ci-item{
  display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;
  transition:background .15s;cursor:pointer;
}
.ci-item:hover{background:rgba(0,0,0,.025)}
.ci-check{
  width:22px;height:22px;border-radius:50%;flex:none;cursor:pointer;
  border:2px solid var(--txt3);display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:12px;font-weight:800;transition:all .15s;
}
.ci-item.done .ci-check{background:var(--green);border-color:var(--green);color:#fff}
.ci-name{flex:1;font-size:15px;color:var(--txt)}
.ci-item.done .ci-name{color:var(--txt2);text-decoration:line-through}
.ci-streak{font-size:12px;color:var(--orange);font-family:var(--mono);flex:none}
.ci-del{
  flex:none;width:22px;height:22px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--txt3);font-size:15px;line-height:1;transition:all .15s;
}
.ci-del:hover{color:#ef4444;background:rgba(239,68,68,.08)}

/* 深色主题下的打卡新布局微调 */
body.dark .ci-left{background:linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.02))}
body.dark .ci-sign-btn{background:#e2e8f0;color:#0f172a}
body.dark .ci-sign-btn.on{background:var(--green);color:#fff}
body.dark .ci-item:hover{background:rgba(255,255,255,.03)}

/* 移动端：打卡布局堆叠 */
@media (max-width:900px){
  .ci-layout{flex-direction:column}
  .ci-left{width:100%}
  .ci-date-big{font-size:28px}
}

/* ===== 左侧栏重制（参考 YUAN 工作台：220px 宽 + 线性图标 + 顶部打卡签到） ===== */
.side{
  width:220px;
  background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.92));
  backdrop-filter:blur(20px) saturate(1.2);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);
  border-right:1px solid var(--line);
  box-shadow:4px 0 20px rgba(0,0,0,.05);
}
body.dark .side{
  background:linear-gradient(180deg, rgba(9,14,26,.88), rgba(6,10,19,.92));
  border-right:1px solid var(--glass-line);
  box-shadow:4px 0 24px rgba(0,0,0,.22);
}
.brand{padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.brand .lg{gap:12px}
.brand .mk{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#fff;box-shadow:0 0 14px rgba(14,165,233,.25);
}
.brand .mk svg{width:19px;height:19px}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.4px;color:var(--txt)}
.brand .sub{font-size:10px;color:var(--txt3);font-family:var(--mono);letter-spacing:.5px}

/* 左侧栏打卡签到区 */
.side-checkin{
  padding:18px;border-bottom:1px solid var(--line);
  text-align:center;
}
.side-date{font-family:var(--mono);font-size:12px;color:var(--txt3);margin-bottom:10px;letter-spacing:.5px}
.side-sign-btn{
  width:100%;padding:11px 0;border-radius:999px;border:0;
  background:#111827;color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  transition:all .18s;font-family:inherit;
}
.side-sign-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.16)}
.side-sign-btn.on{background:var(--green);color:#fff}
body.dark .side-sign-btn.on{background:var(--green);color:#fff}
.side-streak{margin-top:10px;font-size:12px;color:var(--txt2)}
.side-streak b{color:var(--green);font-size:14px}
body.dark .side-sign-btn{background:#e2e8f0;color:#0f172a}

/* 导航：线性图标风格 */
.nav{padding:14px 10px}
.nav .cap{display:none}
.nav-item{
  flex-direction:row;align-items:center;justify-content:flex-start;
  gap:12px;padding:10px 12px;margin-bottom:4px;border-radius:10px;
  color:var(--txt2);font-size:14px;
  transition:background .16s,color .16s;
  width:100%;
}
.nav-item:hover{background:rgba(0,0,0,.04);color:var(--txt)}
.nav-item.on{background:rgba(14,165,233,.10);color:#0f172a}
body.dark .nav-item.on{background:rgba(34,211,238,.12);color:#eafcff}
.nav-item.on::before{display:none}
.nav-item .ic{
  width:20px;height:20px;border-radius:0;
  background:transparent;border:0;
  transition:none;
}
.nav-item .ic svg{width:18px;height:18px;stroke-width:1.8}
.nav-item.on .ic{color:var(--cyan)}
.nav-item .lb{font-weight:560;letter-spacing:.2px;font-size:14px}
.nav-item .ds{display:none}

.side-foot{
  padding:14px 18px 16px;border-top:1px solid var(--line);
  background:transparent;text-align:left;
}
.side-foot .cloud{font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.side-foot .ft-line{font-size:10px;color:var(--txt3)}
.side-foot .ft-line.low{opacity:.65;margin-top:2px}
.side-foot b{color:var(--cyan);font-weight:500}

/* 导航拖拽排序 */
.nav-item{cursor:grab;user-select:none;touch-action:manipulation}
.nav-item:active{cursor:grabbing}
.nav-item[data-sec="all"]{cursor:default}          /* 全部总览固定，不可拖 */
.nav-item.dragging{opacity:.35}
.nav-item.drag-over{box-shadow:0 -2px 0 var(--cyan);border-radius:10px 10px 0 0}
.nav-item.drag-over:last-child{box-shadow:0 2px 0 var(--cyan);border-radius:0 0 10px 10px}
body.dark .nav-item.drag-over{box-shadow:0 -2px 0 var(--cyan)}

/* 主区适配新侧栏宽度 */
.main{padding:28px 32px 50px}

/* 打卡板块左侧日期卡（去掉签到按钮，保留日期显示） */
.ci-left{
  width:200px;flex:none;padding:22px 20px;border-radius:16px;
  background:linear-gradient(160deg, rgba(0,0,0,.025), rgba(0,0,0,.01));
  border:1px solid var(--line);text-align:center;
}
.ci-date-k{font-family:var(--mono);font-size:12px;color:var(--txt3);margin-bottom:6px;letter-spacing:.5px}
.ci-date-big{font-size:42px;font-weight:700;letter-spacing:-1px;color:var(--txt);line-height:1.1}
.ci-date-ym{font-size:13px;color:var(--txt2);margin-top:6px;font-family:var(--mono)}
body.dark .ci-left{background:linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.02))}

/* 移动端：左侧栏改为顶部横向 */
@media (max-width:900px){
  .side{
    width:auto;height:auto;position:sticky;top:0;z-index:30;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .brand{padding:12px 14px 10px}
  .brand-text{display:none}
  .side-checkin{display:none}
  .nav{display:flex;flex-direction:row;align-items:stretch;gap:8px;overflow-x:auto;padding:8px 12px 10px}
  .nav-item{
    width:auto;flex:none;margin-bottom:0;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(0,0,0,.03);
    flex-direction:row;gap:6px;
  }
  .nav-item.on{border-color:rgba(14,165,233,.35);background:rgba(14,165,233,.10)}
  .nav-item .ic{width:18px;height:18px}
  .nav-item .ic svg{width:16px;height:16px}
  .nav-item .lb{font-size:12px}
  .side-foot{display:none}
  .main{padding:18px 15px 40px}
}

body.dark .ci-item:hover{background:rgba(255,255,255,.03)}

body.dark .ci-cal-cell.l4 i{color:#fff}

/* ===== Epic 限免卡片（去领取 + 已领标记） ===== */
.epic{padding:12px 14px}
.epic-game{
  border-radius:11px;padding:11px 13px;margin-bottom:10px;
  background:rgba(255,255,255,.35);border:1px solid rgba(16,185,129,.18);
  transition:border-color .16s, background .16s;
}
.epic-game:last-child{margin-bottom:0}
.epic-game:hover{border-color:rgba(16,185,129,.42);background:rgba(255,255,255,.55)}
.epic-game.got{opacity:.62}
.epic-game.got .title{text-decoration:line-through}
.g-main{display:block;color:inherit;text-decoration:none}
.g-main .title{color:var(--txt);font-weight:600;font-size:14.5px;line-height:1.5}
.g-main:hover .title{color:var(--green)}
.epic .gm{
  font-size:12.5px;color:var(--txt2);font-family:var(--mono);margin-top:4px;
  display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;
}
.epic .free{color:var(--green);font-weight:700}
.epic .cut{color:var(--txt2)}
.epic .left{
  font-size:11px;padding:1px 7px;border-radius:999px;
  background:rgba(16,185,129,.12);color:var(--green);
}
.epic .left.soon{background:rgba(251,146,60,.14);color:var(--orange)}
.epic .left.over{background:rgba(148,163,184,.14);color:var(--txt3)}
.epic-act{display:flex;gap:8px;margin-top:10px}
.epic-claim,.epic-got{
  flex:none;border-radius:8px;padding:5px 13px;font-size:12.5px;cursor:pointer;
  font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;
  transition:all .15s;
}
.epic-claim{
  background:var(--green);border:1px solid var(--green);color:#fff;font-weight:600;
}
.epic-claim:hover{filter:brightness(1.08)}
.epic-claim.disabled{background:transparent;color:var(--txt2);border:1px solid var(--line);font-weight:400}
.epic-got{
  background:transparent;border:1px solid var(--line);color:var(--txt2);
}
.epic-got:hover{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.06)}
.epic-got.on{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.38);color:var(--green)}
.epic-tip{
  margin-top:10px;font-size:11.5px;color:var(--txt3);line-height:1.7;
  padding-top:9px;border-top:1px dashed var(--line);
}
body.dark .epic-game{background:rgba(255,255,255,.03)}
body.dark .epic-game:hover{background:rgba(255,255,255,.06)}

/* ===== 记账模块 ===== */
.book-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.book-sum .b{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.book-sum .b .k{font-size:11px;color:var(--txt3);font-family:var(--mono);letter-spacing:.5px}
.book-sum .b .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.book-sum .b.in .v{color:var(--green)}
.book-sum .b.out .v{color:var(--orange)}
.book-sum .b.bal .v{color:var(--cyan)}
.book-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:14px}
.book-form .fld{display:flex;flex-direction:column;gap:5px}
.book-form label{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.book-form select,.book-form input{
  font-family:inherit;font-size:14px;color:var(--txt);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px;
}
.book-form .amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.book-form select:focus,.book-form input:focus{outline:none;border-color:var(--cyan)}
.book-form .span2{grid-column:span 2}
.book-form .acts{grid-column:1/-1;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.book-btn{
  border:0;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;font-family:inherit;
}
.book-btn:active{filter:brightness(.94)}
.book-acc-manage{font-size:12px;color:var(--txt2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.book-acc-manage .chips{display:flex;gap:6px;flex-wrap:wrap}
.book-acc-manage .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--txt2)}
.book-acc-add{display:flex;gap:6px;align-items:center}
.book-acc-add input{width:120px;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);font-family:inherit}
.book-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.book-row{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.book-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.book-row.in .dot{background:var(--green);box-shadow:0 0 7px var(--green)}
.book-row.out .dot{background:var(--orange);box-shadow:0 0 7px var(--orange)}
.book-row.trans .dot{background:var(--purple);box-shadow:0 0 7px var(--purple)}
.book-row .main{flex:1;min-width:0}
.book-row .t1{font-size:14px;font-weight:560;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.book-row .t1 .cat{font-size:11px;color:var(--txt3);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.book-row .t1 .ac{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.book-row .t2{font-size:11.5px;color:var(--txt3);font-family:var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-row .amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.book-row.in .amt{color:var(--green)}
.book-row.out .amt{color:var(--orange)}
.book-row.trans .amt{color:var(--purple)}
.book-row .del{margin-left:4px;flex:none;width:30px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--txt3);border-radius:8px;cursor:pointer;font-size:13px}
.book-row .del:hover{color:#ef4444;border-color:#ef4444}
.book-empty{color:var(--txt3);font-size:13px;padding:18px;text-align:center}
.book-hint{font-size:11.5px;color:var(--txt3);line-height:1.7;margin-top:6px}

/* ===== 设置与数据 ===== */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0;padding-bottom:0}
.set-row:first-child{padding-top:0}
.set-row .info{flex:1;min-width:0}
.set-row .t{font-size:14px;font-weight:600;margin-bottom:3px}
.set-row .d{font-size:12px;color:var(--txt3);line-height:1.55}
.set-row .btns{display:flex;gap:8px;flex:none}
.set-btn{
  border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;
  padding:8px 16px;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;
}
.set-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.07)}
.set-btn.danger:hover{color:#ef4444;border-color:#ef4444;background:rgba(239,68,68,.07)}
.set-note{
  background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;
  font-size:12.5px;color:var(--txt3);line-height:1.7;margin-bottom:14px;
}
.set-note b{color:var(--cyan);font-weight:500}

/* ===== 移动端：抽屉式侧栏（与电脑端同结构）+ 触控优化 ===== */
.menu-btn{
  display:none;flex:none;width:40px;height:40px;border-radius:10px;
  border:1px solid var(--line);background:transparent;color:var(--txt2);
  cursor:pointer;align-items:center;justify-content:center;transition:.15s;
}
.menu-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(14,165,233,.08)}
.drawer-mask{
  display:none;position:fixed;inset:0;z-index:65;
  background:rgba(0,0,0,.42);
  opacity:0;pointer-events:none;transition:opacity .26s;
}

@media (max-width:900px){
  /* --- 侧栏变成抽屉，结构与电脑端完全一致 --- */
  .side{
    position:fixed;left:0;top:0;bottom:0;height:100%;z-index:70;
    width:min(80vw, 290px);
    transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);
    border-right:1px solid var(--line);border-bottom:0;
    box-shadow:6px 0 30px rgba(0,0,0,.20);
    overflow-y:auto;overscroll-behavior:contain;
    padding-bottom:env(safe-area-inset-bottom);
  }
  body.drawer-open .side{transform:translateX(0)}
  body.drawer-open{overflow:hidden}
  .drawer-mask{display:block}
  body.drawer-open .drawer-mask{opacity:1;pointer-events:auto}
  .menu-btn{display:flex}

  /* 侧栏内部恢复纵向布局（覆盖旧的顶部横向 Tab 样式） */
  .brand{display:block;padding:18px 16px 16px}
  .brand-text{display:flex}
  .side-checkin{display:block;padding:16px}
  .nav{
    display:block;padding:12px 10px;overflow:visible;
    max-height:none;
  }
  .nav-item{
    width:100%;flex-direction:row;justify-content:flex-start;align-items:center;
    gap:12px;padding:12px;border-radius:10px;margin-bottom:4px;
    border:0;background:transparent;
    min-height:46px;
  }
  .nav-item .ic{width:22px;height:22px;background:transparent;border:0}
  .nav-item .ic svg{width:19px;height:19px}
  .nav-item .lb{font-size:14.5px}
  .side-foot{display:block;padding:14px 16px 18px}

  /* --- 主区 --- */
  .main{
    padding:16px 14px 32px;
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
  }
  header{gap:10px 12px;margin-bottom:22px;align-items:center}
  h1{font-size:20px}
  .updated{font-size:12px}
  .grid{grid-template-columns:1fr;gap:16px}

  /* --- 触控目标 ≥44px --- */
  .theme-toggle,.bg-toggle,.bg-clear,.theme-more{width:42px;height:42px;margin-left:0}
  .theme-toggle{margin-left:auto}
  .tab{min-height:38px;padding:8px 15px;font-size:14px}
  .epic-claim,.epic-got{min-height:38px;padding:9px 15px;font-size:13.5px}
  .ci-cal-nav{width:36px;height:36px}
  .ci-cal-today{min-height:36px;padding:8px 13px}
  .ci-cal-cell{min-height:40px}
  .ci-cal-cell span{font-size:13.5px}
  .ci-check{width:26px;height:26px;font-size:13px}
  .ci-del{width:34px;height:34px}
  .ci-item{padding:13px 10px;min-height:48px}
  .ci-bin-item{min-height:36px;padding:7px 13px}
  .ci-add input{                 /* 16px 防止 iOS 自动放大页面 */
    font-size:16px;min-height:46px;padding:10px 13px;
  }
  .ci-add button{min-width:50px;min-height:46px}
  .ci-cf-ok,.ci-cf-no{min-height:34px;padding:6px 14px}

  /* --- 打卡区适配 --- */
  .ci-layout{flex-direction:column;gap:16px}
  .ci-left{width:100%;padding:20px 18px}
  .ci-date-big{font-size:36px}
  .ci-day-section{padding:18px 14px 14px}
  .ci-day-date{font-size:23px}
  .ci-day-top{flex-wrap:wrap;gap:10px}
  .ci-act-btn{min-height:34px;padding:7px 14px}
  .card-body{max-height:none;overflow-y:visible}
}
@media (max-width:520px){
  .main{padding:14px 11px 26px}
  .grid{gap:13px}
  h1{font-size:18px}
  .live{font-size:11px;padding:2px 10px}
  .ci-date-big{font-size:30px}
  .card-head{padding:15px 16px 12px}
  .card-body{padding:14px 16px 16px}
}

/* ===== 导航分组：今日热点资讯（父项 + 缩进子项 + 折叠） ===== */
.nav-item.nav-parent{cursor:pointer}
.nav-item.nav-parent .lb{font-weight:620}
.nav-item .fold{
  flex:none;width:22px;height:22px;border-radius:6px;margin-left:auto;
  display:flex;align-items:center;justify-content:center;
  color:var(--txt3);transition:transform .2s, background .15s, color .15s;
}
.nav-item .fold:hover{background:rgba(0,0,0,.06);color:var(--txt)}
body.dark .nav-item .fold:hover{background:rgba(255,255,255,.08)}
.nav-item .fold.open{transform:rotate(90deg)}
.nav-item.nav-sub{
  margin:0 0 2px 16px;padding:9px 12px;
  border-left:2px solid var(--line);
  border-radius:0 10px 10px 0;
}
.nav-item.nav-sub .lb{font-size:13.5px;font-weight:500}
.nav-item.nav-sub .ic{width:18px;height:18px}
.nav-item.nav-sub .ic svg{width:16px;height:16px}
.nav-item.nav-sub.on{border-left-color:var(--cyan)}
/* 折叠状态：隐藏该分组的子项 */
body.nav-fold-news .nav-item[data-parent="news"]{display:none}
@media (max-width:900px){
  .nav-item.nav-sub{margin-left:14px;min-height:44px;padding:11px 12px}
  .nav-item .fold{width:28px;height:28px}
}

/* ===== 今日热点资讯：子板块索引（点击父项优先展开子选项） ===== */
.news-subs{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.news-sub{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:rgba(0,0,0,.02);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;cursor:pointer;transition:.15s;color:var(--txt);font:inherit;
}
.news-sub:hover{background:rgba(0,0,0,.05);border-color:var(--cyan)}
.news-sub .ns-ic{font-size:20px;flex:none;width:30px;text-align:center}
.news-sub .ns-bd{display:flex;flex-direction:column;flex:1;min-width:0}
.news-sub .ns-name{font-size:15px;font-weight:600}
.news-sub .ns-desc{font-size:12.5px;color:var(--txt3);margin-top:2px}
.news-sub .ns-arrow{color:var(--txt3);font-size:20px;flex:none}
body.dark .news-sub{background:rgba(255,255,255,.03)}
body.dark .news-sub:hover{background:rgba(255,255,255,.06)}
@media (max-width:900px){
  .news-sub{min-height:54px;padding:14px 15px}
  .news-sub .ns-name{font-size:16px}
  .news-sub .ns-ic{width:34px}
}

/* ===== 添加功能（模块市场） ===== */
.side-addfeat{margin-top:8px;width:100%;border:1px dashed var(--cyan);background:transparent;color:var(--cyan);
  border-radius:10px;padding:9px 10px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.side-addfeat:hover{background:rgba(34,211,238,.12)}
body.dark .side-addfeat{background:rgba(34,211,238,.06)}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:460px;max-height:82vh;overflow:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:16px;padding:18px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
body.dark .modal{background:#0f172a}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{border:0;background:rgba(0,0,0,.05);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--txt2)}
body.dark .modal-close{background:rgba(255,255,255,.08);color:var(--txt)}
.addfeat-grid{display:flex;flex-direction:column;gap:10px}
.addfeat-card{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.025);border:1px solid var(--line);
  border-radius:12px;padding:12px 13px}
body.dark .addfeat-card{background:rgba(255,255,255,.04)}
.addfeat-ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:9px;background:rgba(34,211,238,.12);color:var(--cyan)}
.addfeat-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.addfeat-bd{flex:1;min-width:0}
.addfeat-name{font-size:15px;font-weight:600}
.addfeat-desc{font-size:12.5px;color:var(--txt3);margin-top:2px}
.addfeat-add{border:0;background:var(--cyan);color:#04222b;font-weight:600;border-radius:9px;
  padding:8px 14px;cursor:pointer;font:inherit;white-space:nowrap}
.addfeat-add:hover{filter:brightness(.95)}
.addfeat-empty{text-align:center;color:var(--txt3);padding:30px 10px;font-size:14px}
/* 番茄钟 / 倒计时 / 便签 / 喝水打卡 */
.pomo,.count,.notes,.water{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.pomo-mode{font-size:13px;color:var(--txt3);letter-spacing:1px}
.pomo-time{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pomo-ses{font-size:13px;color:var(--txt2)}
.pomo-btns,.count-btns,.water-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pomo-btn{border:1px solid var(--cyan);background:var(--cyan);color:#04222b;font-weight:600;border-radius:10px;
  padding:9px 18px;cursor:pointer;font:inherit;min-height:42px}
.pomo-btn.ghost{background:transparent;color:var(--cyan)}
.count-input{width:100%;max-width:280px;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--txt)}
body.dark .count-input{background:#0b1220}
.count-time{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.count-hint{font-size:13px;color:var(--txt3);text-align:center}
.notes-area{width:100%;min-height:160px;resize:vertical;font:inherit;font-size:15px;line-height:1.6;
  padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--txt)}
body.dark .notes-area{background:#0b1220}
.notes-foot{font-size:12px;color:var(--txt3);align-self:flex-end}
.water-cups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:320px}
.cup{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.06);border:1px solid var(--line);transition:.15s}
.cup.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.4)}
body.dark .cup{background:rgba(255,255,255,.08)}
.water-stat{font-size:14px;color:var(--txt2)}
@media (max-width:600px){ .pomo-time{font-size:44px} .modal{max-width:100%} }

/* ===== 我的收藏夹 ===== */
.fav-add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fav-in{
  flex:1 1 160px;min-width:0;
  background:rgba(0,0,0,.03);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);padding:9px 12px;
  font:inherit;font-size:14px;outline:none;
}
.fav-in:focus{border-color:var(--purple)}
.fav-in::placeholder{color:var(--txt3)}
.fav-btn-main{
  flex:none;background:var(--purple);border:0;color:#fff;
  border-radius:9px;padding:9px 20px;font:inherit;font-size:14px;
  font-weight:600;cursor:pointer;transition:.15s;
}
.fav-btn-main:hover{filter:brightness(1.08)}

.fav-bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
.fav-chip{
  border:1px solid var(--line);background:transparent;color:var(--txt2);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:12.5px;
  cursor:pointer;transition:.15s;
}
.fav-chip:hover{border-color:var(--purple);color:var(--purple)}
.fav-chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.fav-search{
  flex:1 1 120px;min-width:100px;margin-left:auto;
  background:rgba(0,0,0,.03);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);padding:7px 12px;
  font:inherit;font-size:13.5px;outline:none;
}
.fav-search:focus{border-color:var(--purple)}

.fav-list{display:flex;flex-direction:column;gap:8px}
.fav-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 12px;border-radius:11px;
  background:rgba(0,0,0,.02);border:1px solid var(--line);
  transition:background .15s,border-color .15s;
}
.fav-item:hover{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12)}
.fav-type{
  flex:none;font-size:10.5px;padding:2px 8px;border-radius:6px;
  font-family:var(--mono);margin-top:2px;
}
.fav-type.t-video{background:rgba(236,72,153,.12);color:var(--pink)}
.fav-type.t-tweet{background:rgba(14,165,233,.12);color:var(--cyan)}
.fav-type.t-article{background:rgba(59,130,246,.12);color:var(--blue)}
.fav-type.t-idea{background:rgba(139,92,246,.12);color:var(--purple)}
.fav-body{flex:1;min-width:0}
.fav-title{
  display:block;color:var(--txt);font-size:14.5px;font-weight:560;
  text-decoration:none;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
a.fav-title:hover{color:var(--purple)}
.fav-meta{
  display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:3px;
  font-size:12px;color:var(--txt3);font-family:var(--mono);
}
.fav-host{color:var(--txt2)}
.fav-note{
  color:var(--txt2);font-family:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
}
.fav-del{
  flex:none;width:26px;height:26px;border-radius:7px;cursor:pointer;
  border:0;background:transparent;color:var(--txt3);font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.fav-del:hover{color:#ef4444;background:rgba(239,68,68,.10)}

.fav-foot{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-top:14px;padding-top:11px;border-top:1px dashed var(--line);
}
.fav-mini{
  border:1px solid var(--line);background:transparent;color:var(--txt2);
  border-radius:8px;padding:5px 13px;font:inherit;font-size:12px;cursor:pointer;transition:.15s;
}
.fav-mini:hover{border-color:var(--purple);color:var(--purple);background:rgba(139,92,246,.06)}
.fav-count{margin-left:auto;font-size:11.5px;color:var(--txt3);font-family:var(--mono)}

body.dark .fav-in,body.dark .fav-search{background:rgba(255,255,255,.05)}
body.dark .fav-item{background:rgba(255,255,255,.03)}
body.dark .fav-item:hover{background:rgba(255,255,255,.06)}

@media (max-width:900px){
  .fav-in{font-size:16px;min-height:46px;padding:11px 13px}   /* 16px 防 iOS 缩放 */
  .fav-btn-main{min-height:46px;padding:11px 22px}
  .fav-chip{min-height:34px;padding:7px 14px}
  .fav-search{min-height:40px;font-size:16px}
  .fav-del{width:34px;height:34px}
  .fav-mini{min-height:34px;padding:7px 14px}
}

/* ===== 黑白极简风：中性化所有硬彩（覆盖 body:not(.dark) 的彩色规则 + 新增模块选择器） ===== */
body.theme-mono .live{color:var(--txt2);border-color:var(--line);background:rgba(0,0,0,.04)}
body.theme-mono .live i{background:var(--txt2);box-shadow:none}
body.theme-mono h1{background:none;-webkit-text-fill-color:var(--txt);color:var(--txt)}
body.theme-mono .brand .mk{box-shadow:none}
body.theme-mono .nav-item.on{background:rgba(0,0,0,.06);color:var(--txt)}
body.theme-mono .nav-item.on::before{background:var(--txt);box-shadow:none}
body.theme-mono .nav-item.on .ic{color:var(--txt);background:rgba(0,0,0,.05);border-color:var(--line);box-shadow:none}
body.theme-mono .side-foot b{color:var(--txt)}
body.theme-mono .epic{background:rgba(0,0,0,.03);border:1px solid var(--line)}
body.theme-mono .ci-prog .ci-count b{color:var(--txt)}
body.theme-mono .ci-item.done .ci-check{background:var(--txt);border-color:var(--txt);color:#fff;box-shadow:none}
body.theme-mono .ci-cal-nav:hover{background:rgba(0,0,0,.05);color:var(--txt);border-color:var(--line)}
body.theme-mono .ci-cal-cell:hover{border-color:var(--line)}
body.theme-mono .ci-cal-cell.today{border-color:var(--txt);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
body.theme-mono .ci-cal-cell.l1{background:rgba(0,0,0,.10)}
body.theme-mono .ci-cal-cell.l2{background:rgba(0,0,0,.18)}
body.theme-mono .ci-cal-cell.l3{background:rgba(0,0,0,.28)}
body.theme-mono .ci-cal-cell.l4{background:var(--txt)}
body.theme-mono .ci-cal-cell.l4 span{color:#fff}
body.theme-mono .ci-cal-cell.l4 i{color:#fff}

  .gh{font-size:13px}

  .gh-item{display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
  .gh-item:last-child{border-bottom:0}
  .gh-rank{font-weight:700;color:var(--cyan);text-align:right;font-variant-numeric:tabular-nums}

  .gh-stars{grid-row:1;color:var(--orange);font-variant-numeric:tabular-nums;white-space:nowrap}

  .gh-desc{grid-column:2;font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.45}
  .gh-empty{color:var(--txt2);text-align:center;padding:18px 0}

        : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    }
  }
  function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || "light"; }catch(e){ return "light"; } }
  function saveTheme(mode){ try{ localStorage.setItem(THEME_KEY, mode); }catch(e){} }
  function setTheme(mode){ applyThemeMode(mode); saveTheme(mode); }
  applyThemeMode(loadTheme());

  /* 主题选择弹窗 */
  function openThemePicker(){
    var grid = document.getElementById("themeGrid");
    var cur = loadTheme();
    if(grid){
      grid.innerHTML = THEMES.map(function(t){

  function bindThemePicker(){
    var mask = document.getElementById("themeMask");

    mask.__themeBound = true;
    mask.addEventListener("click", function(e){
      var cl = e.target.getAttribute ? e.target.getAttribute("data-close") : null;
      if(e.target === mask || cl){ closeThemePicker(); return; }
      var card = e.target.closest ? e.target.closest("[data-theme]") : null;
      if(card){ setTheme(card.getAttribute("data-theme")); closeThemePicker(); }

  /* ---- 自定义背景图 ---- */
  var BG_KEY = "wb_bg_img_v1";
  var DIM_KEY = "wb_bg_dim_v1";
  function loadBg(){ try{ return localStorage.getItem(BG_KEY); }catch(e){ return null; } }
  function saveBg(url){ try{ if(url) localStorage.setItem(BG_KEY, url); else localStorage.removeItem(BG_KEY); }catch(e){} }
  function loadBgDim(){
    try{
      var v = localStorage.getItem(DIM_KEY);
      return v == null ? 0.30 : parseFloat(v);
    }catch(e){ return 0.30; }
  }
  function saveBgDim(v){ try{ localStorage.setItem(DIM_KEY, String(v)); }catch(e){} }
  function applyBgDim(){
    if(document.documentElement && document.documentElement.style)
      document.documentElement.style.setProperty("--bg-dim", loadBgDim());
  }
  function applyBg(){
    var url = loadBg();
    var body = document.body;
    if(!body || !body.classList) return;
    body.classList.toggle("has-bg", !!url);
    if(document.documentElement && document.documentElement.style)
      document.documentElement.style.setProperty("--bg-img", url ? "url('" + url + "')" : "none");
    applyBgDim();
  }
  function processBgFile(file){
    if(!file || !file.type.match(/^image\//)) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement("canvas");
        var MAX_W = 1600;                 /* 背景图要清晰，800 太小会糊 */
        var scale = Math.min(1, MAX_W / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var data = canvas.toDataURL("image/jpeg", 0.85);
        saveBg(data);
        applyBg();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  applyBg();
  /* 提前绑定左侧栏「打卡签到」：独立于 grid，避免后续初始化异常时按钮整体失效 */
  try { bindSidebarCheckin(); } catch(e){}
  /* 注册 Service Worker：让手机端（APK / 添加到主屏幕）断网时也能打开工作台 */
  try{
    if('serviceWorker' in navigator){
      var swProtoOK = location.protocol === 'https:' ||
                      location.hostname === 'localhost' ||
                      location.hostname === '127.0.0.1';

        window.addEventListener('load', function(){
          navigator.serviceWorker.register('sw.js').catch(function(){});
        });
      }
    }
  }catch(e){}
  document.addEventListener("DOMContentLoaded", function(){

    var bgBtn = document.getElementById("bgToggle");

    }
    if(bgClear){
      bgClear.addEventListener("click", function(){
        saveBg(null);

      });
    }
    var bgDim = document.getElementById("bgDim");
    if(bgDim){
      bgDim.value = Math.round(loadBgDim() * 100);
      applyBgDim();
      bgDim.addEventListener("input", function(){
        saveBgDim(parseInt(this.value, 10) / 100);

      });

  var D = window.WB_DATA || {};

  /* ---- 0. 每日打卡（对话记录 + 页面点击 双向打通） ----
     权威数据：window.HABITS（由 habit-tracker-companion.py export_js 生成，对话里说一句「打卡」就写进去）
     页面数据：localStorage —— on{id:[日期]} 补齐、off{id:[日期]} 抵消，两者叠加后得到最终状态 */
  var HB = window.HABITS || null;
  var CI_KEY = "wb_habit_local_v1";
  var CX_KEY = "wb_habit_extra_v1";
  var CD_KEY = "wb_habit_deleted_v1";
  var ciLocal = null;
  /* 日历状态：选中哪天、当前看哪个月、正在确认删除的项 */
  var ciSel = null;
  var ciCalY = null, ciCalM = null;
  var ciDelConfirm = null;
  function ciLoadLocal(){
    try{
      var d = JSON.parse(localStorage.getItem(CI_KEY));
      if(d && d.on && d.off) return d;
    }catch(e){}
    var def = {on:{}, off:{}};
    ciSaveLocal(def);
    return def;
  }
  function ciSaveLocal(d){ try{ localStorage.setItem(CI_KEY, JSON.stringify(d)); }catch(e){} }
  function ciExtras(){
    try{ var a = JSON.parse(localStorage.getItem(CX_KEY)); if(Object.prototype.toString.call(a)==="[object Array]") return a; }catch(e){}
    return [];
  }
  function ciSaveExtras(a){ try{ localStorage.setItem(CX_KEY, JSON.stringify(a)); }catch(e){} }
  function ciKey(dt){
    var d = dt || new Date();
    return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
  }
  /* 已删除（隐藏）的习惯 id：脚本项删不掉，只能在页面隐藏 */
  function ciDeleted(){
    try{ var a = JSON.parse(localStorage.getItem(CD_KEY)); if(Object.prototype.toString.call(a)==="[object Array]") return a; }catch(e){}
    return [];
  }
  function ciSaveDeleted(a){ try{ localStorage.setItem(CD_KEY, JSON.stringify(a)); }catch(e){} }

  /* 习惯项：脚本里的权威清单 + 页面自定义项；pin 项（每日打卡总开关）置顶；删掉的过滤掉 */
  function ciItems(){
    var del = ciDeleted();
    var out = [];
    if(HB && HB.habits) HB.habits.forEach(function(h){
      if(del.indexOf(String(h.id)) < 0)
        out.push({id:String(h.id), name:h.name, desc:h.desc||"", src:"cloud", pin:!!h.pin});
    });
    ciExtras().forEach(function(x){
      if(del.indexOf(x.id) < 0) out.push({id:x.id, name:x.name, desc:"", src:"local", pin:false});
    });
    out.sort(function(a,b){ return (b.pin?1:0) - (a.pin?1:0); });
    return out;
  }
  function ciCloudDays(id){ return (HB && HB.logs && HB.logs[id]) || []; }
  function ciSkips(id){ return (HB && HB.skips && HB.skips[id]) || []; }
  /* 最终完成状态：对话记录 ⊕ 页面补齐 ⊖ 页面抵消 */
  function ciDone(id, k){
    if(((ciLocal.off[id]||[]).indexOf(k)) >= 0) return false;
    if(((ciLocal.on[id]||[]).indexOf(k)) >= 0) return true;
    return ciCloudDays(id).indexOf(k) >= 0;
  }
  function ciToggle(id, k){
    if(!ciLocal.on[id]) ciLocal.on[id] = [];
    if(!ciLocal.off[id]) ciLocal.off[id] = [];
    var cur = ciDone(id, k);
    var p = ciLocal.on[id].indexOf(k);  if(p >= 0) ciLocal.on[id].splice(p,1);
    var q = ciLocal.off[id].indexOf(k); if(q >= 0) ciLocal.off[id].splice(q,1);
    if(cur) ciLocal.off[id].push(k); else ciLocal.on[id].push(k);
    ciSaveLocal(ciLocal);
  }
  function ciStreak(id){
    var n = 0, d = new Date();
    if(!ciDone(id, ciKey(d))) d.setDate(d.getDate()-1);
    while(true){
      var k = ciKey(d);
      if(ciDone(id, k)){ n++; d.setDate(d.getDate()-1); }
      else if(ciSkips(id).indexOf(k) >= 0){ d.setDate(d.getDate()-1); }  // 请假日不打断
      else break;
    }
    return n;
  }
  /* 日期标签：今天 / 昨天 / 8月27日 周三 */
  function ciDayLabel(k){
    var tk = ciKey();
    if(k === tk) return "今天";
    var yd = new Date(); yd.setDate(yd.getDate()-1);
    if(k === ciKey(yd)) return "昨天";
    var p = k.split("-");
    var wd = ["日","一","二","三","四","五","六"][new Date(+p[0], +p[1]-1, +p[2]).getDay()];
    return (+p[1]) + "月" + (+p[2]) + "日 周" + wd;
  }

  /* ---- 月历 ---- */
  function ciCalHtml(all){
    var total = all.length;
    var y = ciCalY, m = ciCalM;
    var lead = new Date(y, m, 1).getDay();                      /* 周日为第一列 */
    var dim  = new Date(y, m+1, 0).getDate();
    var pdim = new Date(y, m, 0).getDate();
    var tk = ciKey();
    var nd = new Date();
    var isCur = (y === nd.getFullYear() && m === nd.getMonth());
    var h = '<div class="ci-cal">';
    h += '<div class="ci-cal-hd">'
      + '<div class="ci-cal-tt"><b>' + ['January','February','March','April','May','June','July','August','September','October','November','December'][m] + ' ' + y + '</b><span>/ ' + ('0'+(m+1)).slice(-2) + '</span></div>'
      + '<div class="ci-cal-tools">'
      + '<button class="ci-cal-nav" data-cal="-1" title="上个月">‹</button>'
      + '<button class="ci-cal-nav" data-cal="1" title="下个月">›</button>'
      + (isCur ? '' : '<button class="ci-cal-today" data-cal="0">回到今天</button>')
      + '</div></div>';
    h += '<div class="ci-cal-grid">';
    h += ["SUN","MON","TUE","WED","THU","FRI","SAT"].map(function(d){ return '<div class="ci-cal-dow">' + d + '</div>'; }).join("");
    var i;
    for(i = lead; i > 0; i--) h += '<div class="ci-cal-cell out"><span>' + (pdim - i + 1) + '</span></div>';
    for(i = 1; i <= dim; i++){
      var k = y + "-" + ("0"+(m+1)).slice(-2) + "-" + ("0"+i).slice(-2);
      var fut = k > tk;
      var done = all.filter(function(it){ return ciDone(it.id, k); }).length;
      var lv = (!done || !total) ? 0 : Math.min(4, Math.ceil(done/total*4));
      h += '<div class="ci-cal-cell' + (fut?" fut":"") + (k===tk?" today":"") + (k===ciSel?" sel":"") + (done?" l"+lv:"")
        + '" data-day="' + k + '" title="' + k + '　完成 ' + done + '/' + total + '">'
        + '<span>' + i + '</span>' + (done ? '<i>' + done + '</i>' : '') + '</div>';
    }
    h += '</div>';
    h += '<div class="ci-legend"><span>少</span><em class="l0"></em><em class="l1"></em><em class="l2"></em>'
      + '<em class="l3"></em><em class="l4"></em><span>多</span><b>点日期可补打卡</b></div>';
    return h + '</div>';
  }
  function ciMonthCount(all, y, m){
    var n = 0, dim = new Date(y, m+1, 0).getDate();
    for(var i=1;i<=dim;i++){
      var k = y + "-" + ("0"+(m+1)).slice(-2) + "-" + ("0"+i).slice(-2);
      if(all.filter(function(it){ return ciDone(it.id, k); }).length) n++;
    }
    return n;
  }

  /* ---- 选中那天的明细（逐项打卡） ---- */
  function ciDayHtml(all, k){
    var tk = ciKey();
    var h = '<div class="ci-day"><div class="ci-day-hd"><span>' + ciDayLabel(k) + '</span>'
      + '<span class="ci-day-dt">' + k + '</span></div>';
    if(k > tk){
      h += '<div class="ci-day-fut">还没到，不能提前打卡</div></div>';
      return h;
    }
    all.forEach(function(it){
      if(ciDelConfirm === it.id){
        h += '<div class="ci-item cf"><div class="ci-name">删除「' + esc(it.name) + '」？</div>'
          + '<button class="ci-cf-ok" data-ok="' + esc(it.id) + '">删除</button>'
          + '<button class="ci-cf-no" data-no="1">取消</button></div>';
        return;
      }
      var on = ciDone(it.id, k);
      var st = ciStreak(it.id);
      h += '<div class="ci-item' + (on?" done":"") + (it.pin?" pin":"") + '" data-id="' + esc(it.id) + '">'
        + '<div class="ci-check">' + (on ? "✓" : "") + '</div>'
        + '<div class="ci-name">' + esc(it.name)
        + (it.src==="cloud" ? '<span class="ci-src" title="来自对话记录，与脚本同步">💬</span>' : '')
        + '</div>'
        + (st>0 ? '<div class="ci-streak">🔥 ' + st + ' 天</div>' : '')
        + '<div class="ci-del" data-del="' + esc(it.id) + '" title="删除此项">×</div>'
        + '</div>';
    });
    return h + '</div>';
  }

  function ciBodyHtml(){
    var all = ciItems();
    var items = all;
    var total = items.length;
    var k = ciSel || ciKey();
    var h = "";

    /* 上部：左侧日期卡，右侧月历 */
    h += '<div class="ci-layout">';
    h += '<div class="ci-left">';
    h += '<div class="ci-date-k">' + k + '</div>';
    h += '<div class="ci-date-big">' + k.split('-')[2] + '</div>';
    h += '<div class="ci-date-ym">' + ['January','February','March','April','May','June','July','August','September','October','November','December'][parseInt(k.split('-')[1],10)-1] + ' ' + k.split('-')[0] + '</div>';
    h += '</div>'; // ci-left
    h += '<div class="ci-right">' + ciCalHtml(all) + '</div>';
    h += '</div>'; // ci-layout

    /* 下部：SELECTED DAY + 事项列表 */
    h += '<div class="ci-day-section">';
    h += '<div class="ci-day-top">'
      + '<div><div class="ci-day-tag">SELECTED DAY</div><div class="ci-day-date">' + k + '</div></div>'
      + '<div class="ci-day-actions">'
      + '<button class="ci-act-btn' + (MUTE ? ' off' : '') + '" data-mute="1" title="打卡音效开关">' + (MUTE ? '🔇 已静音' : '🔊 音效开') + '</button>'
      + '</div></div>';
    if(!all.length){
      h += '<div class="empty">还没有习惯项<br>在对话里说「新建习惯：跑步」即可添加</div>';

    h += '</div>'; // ci-day-section

    /* 新增 */
    h += '<div class="ci-add"><input id="ciNewName" maxlength="24" placeholder="新增习惯项，如：跑步 20 分钟"><button id="ciAddBtn" title="添加">＋</button></div>';

    /* 已删除项（可恢复） */
    var del = ciDeleted();
    if(del.length){
      h += '<div class="ci-bin"><div class="ci-bin-hd">已删除 ' + del.length + ' 项 · 点一下恢复</div><div class="ci-bin-list">';
      del.forEach(function(id){
        var nm = id;
        if(HB && HB.habits) HB.habits.forEach(function(x){ if(String(x.id) === id) nm = x.name; });
        ciExtras().forEach(function(x){ if(x.id === id) nm = x.name; });
        h += '<button class="ci-bin-item" data-undo="' + esc(id) + '">↩ ' + esc(nm) + '</button>';
      });
      h += '</div></div>';
    }
    /* 同步提示 */
    if(HB && HB.updatedAt){
      h += '<div class="ci-sync">对话记录同步于 ' + esc(HB.updatedAt)
        + ' ｜ 页面点一下也记，两边叠加</div>';
    }
    return h;
  }
  function pCheckin(){
    var sub = (HB && HB.habits) ? ("对话 + 本地 " + HB.habits.length + " 项") : "本地保存";
    return card("card-acc-green","🎯","每日打卡", sub, '<div id="ciBody">' + ciBodyHtml() + '</div>');

  function ciAdd(){
    var inp = document.getElementById("ciNewName");
    if(!inp) return;
    var name = (inp.value||"").trim();

  function ciRerender(){

  /* ---- 左侧栏签到（独立于习惯系统，记到 localStorage） ---- */
  function loadSign(){
    try{ var a = JSON.parse(localStorage.getItem(SIGN_KEY)); return Array.isArray(a) ? a : []; }
    catch(e){ return []; }
  }
  function saveSign(a){ try{ localStorage.setItem(SIGN_KEY, JSON.stringify(a)); }catch(e){} }
  function signDone(k){ return loadSign().indexOf(k) >= 0; }
  function signToggle(){
    var k = ciKey();
    var a = loadSign();
    var i = a.indexOf(k);
    if(i >= 0) a.splice(i,1); else a.push(k);
    saveSign(a);
    updateSideCheckin();
    afterSign();                      /* 音效 + 成功弹窗 */
  }
  /* 签到反馈：取消只出声，成功出声 + 弹窗（与习惯打卡一致） */
  function afterSign(){
    var k = ciKey();
    if(!signDone(k)){ try{ sndUncheck(); }catch(e){} return; }
    var st = signStreak();
    var ms = (CI_MS && CI_MS[st]) || "";           /* CI_MS 可能在早期 return 后未定义，需兜底 */
    try{ sndCheck(st >= 3); }catch(e){}            /* 音效失败绝不影响打卡结果 */
    try{ showToast("每日签到", st, ms); }catch(e){}
  }
  function signStreak(){
    var n = 0, d = new Date();
    if(!signDone(ciKey(d))) d.setDate(d.getDate()-1);
    while(true){
      var k = ciKey(d);
      if(signDone(k)){ n++; d.setDate(d.getDate()-1); }
      else break;
    }
    return n;
  }
  function updateSideCheckin(){
    var d = document.getElementById("sideDate");
    if(d) d.textContent = ciKey();
    var s = document.getElementById("sideStreak");
    if(s) s.textContent = signStreak();
    var btn = document.getElementById("sideSignBtn");
    if(btn){
      var done = signDone(ciKey());
      btn.textContent = done ? "已签到" : "打卡签到";

  var MK = "wb_habit_mute_v1";
  var MUTE = false, AC = null, toastTimer = null;
  function loadMute(){ try{ return localStorage.getItem(MK) === "1"; }catch(e){ return false; } }
  function saveMute(m){ try{ localStorage.setItem(MK, m ? "1" : "0"); }catch(e){} }

  function audioCtx(){
    if(MUTE) return null;
    try{
      if(!AC){
        var C = window.AudioContext || window.webkitAudioContext;
        if(!C) return null;
        AC = new C();
      }
      if(AC.state === "suspended" && AC.resume) AC.resume();
      return AC;
    }catch(e){ return null; }
  }
  function beep(c, freq, at, dur, type, vol){
    try{
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      var t0 = c.currentTime + at;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }catch(e){}
  }
  /* 打卡：上行琶音（命中里程碑时更长更亮） */
  function sndCheck(big){
    var c = audioCtx(); if(!c) return;
    var seq = big ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 783.99];
    for(var i=0;i<seq.length;i++){
      var at = i * (big ? 0.085 : 0.075);
      beep(c, seq[i], at, big ? 0.46 : 0.28, "sine", big ? 0.2 : 0.16);
      beep(c, seq[i] * 2, at + 0.008, big ? 0.3 : 0.16, "triangle", 0.045);
    }
  }
  /* 取消打卡：短促下行 */
  function sndUncheck(){
    var c = audioCtx(); if(!c) return;
    beep(c, 392, 0, 0.13, "sine", 0.11);
    beep(c, 293.66, 0.085, 0.2, "sine", 0.09);
  }

    /* 自定义项：真删；脚本里的项：本地隐藏（脚本重新导出不会复活） */
    var ex = ciExtras();
    var isExtra = false;
    ex.forEach(function(x){ if(x.id === id) isExtra = true; });
    if(isExtra){
      ciSaveExtras(ex.filter(function(x){ return x.id !== id; }));
    }else{

  function ciBind(){
    var body = document.getElementById("ciBody");
    if(!body) return;
    body.addEventListener("click", function(ev){
      var t = ev.target;
      if(t.id === "ciAddBtn"){ ciAdd(); return; }
      /* 音效开关 */
      if(t.closest && t.closest("[data-mute]")){
        MUTE = !MUTE;
        saveMute(MUTE);
        if(!MUTE){ var c0 = audioCtx(); if(c0) beep(c0, 659.25, 0, 0.16, "sine", 0.14); }
        ciRerender();
        return;
      }
      /* 日历翻月 */
      var cal = t.closest ? t.closest("[data-cal]") : null;
      if(cal){
        var n = parseInt(cal.getAttribute("data-cal"), 10);
        if(n === 0){
          var nd = new Date();
          ciCalY = nd.getFullYear(); ciCalM = nd.getMonth(); ciSel = ciKey();
        }else{
          var m2 = ciCalM + n;
          ciCalY = ciCalY + Math.floor(m2 / 12);
          ciCalM = ((m2 % 12) + 12) % 12;
        }
        ciDelConfirm = null;
        ciRerender();
        return;
      }
      /* 选日期（未来不可选） */
      var day = t.closest ? t.closest("[data-day]") : null;
      if(day){
        var k = day.getAttribute("data-day");
        if(k <= ciKey()){ ciSel = k; ciDelConfirm = null; ciRerender(); }
        return;
      }
      /* 删除确认 */
      var okb = t.closest ? t.closest("[data-ok]") : null;
      if(okb){ ciRemove(okb.getAttribute("data-ok")); return; }
      if(t.closest && t.closest("[data-no]")){ ciDelConfirm = null; ciRerender(); return; }
      var del = t.closest ? t.closest("[data-del]") : null;
      if(del){ ciDelConfirm = del.getAttribute("data-del"); ciRerender(); return; }
      /* 恢复已删除 */
      var undo = t.closest ? t.closest("[data-undo]") : null;
      if(undo){
        var uid = undo.getAttribute("data-undo");
        ciSaveDeleted(ciDeleted().filter(function(x){ return x !== uid; }));
        ciRerender();
        return;
      }
      /* 打卡 / 取消（打的是选中的那天） */
      if(ciDelConfirm) return;
      var item = t.closest ? t.closest(".ci-item[data-id]") : null;
      if(item){
        var tid = item.getAttribute("data-id");
        var tk = ciSel || ciKey();
        ciToggle(tid, tk);
        ciRerender();
        afterToggle(tid, tk);
      }
    });
    body.addEventListener("keydown", function(ev){
      if(ev.target.id === "ciNewName" && (ev.key === "Enter" || ev.keyCode === 13)) ciAdd();
    });
  }

  /* ---- 0.6 设置与数据（导出 / 导入 / 清空本工作台全部本地数据） ---- */
  var SET_KEYS = [
    "wb_habit_local_v1","wb_habit_extra_v1","wb_habit_deleted_v1","wb_habit_mute_v1",
    "wb_signin_v1","wb_todo_v1","wb_favorites_v1","wb_nav_order_v1","wb_nav_fold_v1",
    "wb_theme_v1","wb_bg_img_v1","wb_bg_dim_v1","wb_epic_claimed_v1","wb_book_v1","wb_book_accounts_v1"
  ];
  function settingsData(){
    var obj = { meta:{ exportedAt:new Date().toISOString(), version:"1.0", app:"个人工作台" }, data:{} };
    SET_KEYS.forEach(function(k){
      try{
        var v = localStorage.getItem(k);
        if(v !== null) obj.data[k] = JSON.parse(v);
      }catch(e){}
    });
    return obj;
  }
  function settingsExport(){
    var obj = settingsData();
    var blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
    var url = (window.URL || window.webkitURL).createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "workbench-data-" + bkToday() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    (window.URL || window.webkitURL).revokeObjectURL(url);
  }
  function settingsImport(file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(ev){
      try{
        var obj = JSON.parse(ev.target.result);
        if(!obj || !obj.data || typeof obj.data !== "object") throw new Error("格式不正确");
        var keys = Object.keys(obj.data);
        if(!keys.length) throw new Error("文件中没有数据");
        var msg = "导入将覆盖当前 " + keys.length + " 项本地数据，且不可撤销。\n确定继续？";
        if(typeof window.confirm === "function" && !window.confirm(msg)){
          showToast("设置", 0, "已取消导入", "导入已取消");
          return;
        }
        keys.forEach(function(k){
          try{
            if(obj.data[k] === undefined) localStorage.removeItem(k);
            else localStorage.setItem(k, JSON.stringify(obj.data[k]));
          }catch(e){}
        });
        showToast("设置", 0, "数据导入成功，页面即将刷新", "导入成功");
        setTimeout(function(){ if(window.location && window.location.reload) window.location.reload(); }, 800);
      }catch(e){
        showToast("设置", 0, "导入失败：" + (e.message || "文件格式错误"), "导入失败");
      }
    };
    r.readAsText(file);
  }
